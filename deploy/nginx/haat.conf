# /etc/nginx/sites-available/haat  (linked from sites-enabled)
# The TLS certificate comes from certbot (`certbot --nginx -d production.khalidsyfullah.com`);
# certbot renew uses the nginx plugin, which works with this file as it is.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream haat_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream haat_api {
    server 127.0.0.1:4100;
    keepalive 16;
}

# Reject requests for unknown hosts
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name production.khalidsyfullah.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name production.khalidsyfullah.com;

    ssl_certificate /etc/letsencrypt/live/production.khalidsyfullah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/production.khalidsyfullah.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Product images and Excel imports
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/json application/javascript text/xml application/xml image/svg+xml;

    # proxy_set_header inside a location replaces the whole inherited set, so every
    # location below lists its headers in full.
    proxy_http_version 1.1;

    # API and payment-gateway callbacks go straight to NestJS
    location /api/ {
        proxy_pass http://haat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Uploaded and seeded images (the API sets a 7-day cache)
    location /uploads/ {
        proxy_pass http://haat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Hashed Next.js assets never change
    location /_next/static/ {
        proxy_pass http://haat_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://haat_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_read_timeout 60s;
    }
}
