name: Deploy

# Every push to main: run CI, then deploy that commit to the EC2 server through
# AWS Systems Manager. GitHub OIDC is used to assume the haat-github-deploy role,
# so there are no stored AWS keys and no SSH. See deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://production.khalidsyfullah.com
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      INSTANCE_ID: i-06b375f9360b2a8b4
      SITE: https://production.khalidsyfullah.com
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::312605974340:role/haat-github-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and release on the server
        run: |
          params=$(jq -nc --arg c "/usr/local/bin/haat-deploy $GITHUB_SHA" '{commands: [$c], executionTimeout: ["2100"]}')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy haat ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for _ in $(seq 1 240); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          err=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)
          if [ -n "$err" ] && [ "$err" != "None" ]; then echo "--- stderr"; echo "$err" | tail -n 60; fi
          echo "Deploy status: $status"
          [ "$status" = "Success" ]

      - name: Smoke test the public site
        run: |
          for i in $(seq 1 10); do
            rev=$(curl -fsS "$SITE/api/health" | jq -r .revision || true)
            if [ "$rev" = "$GITHUB_SHA" ] && curl -fsS -o /dev/null "$SITE/"; then
              echo "Live at $SITE on ${GITHUB_SHA::7}"
              exit 0
            fi
            sleep 6
          done
          echo "The public site is not serving $GITHUB_SHA (health says: ${rev:-no answer})"
          exit 1
