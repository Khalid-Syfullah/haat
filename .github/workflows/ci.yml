name: CI

# Runs on pull requests. Pushes to main run the same checks from deploy.yml,
# which deploys only when they pass.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tuktakbazaar
          POSTGRES_PASSWORD: tuktakbazaar
          POSTGRES_DB: tuktakbazaar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tuktakbazaar" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://tuktakbazaar:tuktakbazaar@localhost:5432/tuktakbazaar?schema=public
      JWT_SECRET: ci-secret
      PAYMENT_PROVIDER: mock
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      DISABLE_JOBS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database
        run: npm run db:deploy -w apps/api && npm run db:seed -w apps/api
      - name: Type-check
        run: npx tsc --noEmit -p apps/api/tsconfig.json && npm run typecheck -w apps/web
      - name: Build API
        run: npm run build -w apps/api
      - name: End-to-end checks
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          npx wait-on -t 60000 http-get://localhost:4000/api/health
          npm run test:e2e -w apps/api
      - name: Build web
        run: npm run build -w apps/web
      - if: failure()
        run: cat /tmp/api.log || true
